# Builds both images on every push/PR so a broken Dockerfile is caught early.
# Images are pushed to GHCR only for version tags (v*), e.g. `git tag v0.2.0 && git push --tags`.
name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q

  coordinator:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the image carries PyTorch and its build layers)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gpupool-coordinator
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coordinator.Dockerfile
          # The published image ships the HF -> GGUF conversion toolchain (llama.cpp tools + PyTorch CPU).
          build-args: |
            WITH_CONVERT=1
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=coordinator
          cache-to: type=gha,mode=max,scope=coordinator
      - name: Smoke test (starts, serves the UI and health)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          img=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run -d --name gpupool-smoke -p 8080:8080 -e GPUPOOL_ADMIN_KEY=k -e GPUPOOL_CLUSTER_TOKEN=t "$img"
          for i in $(seq 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/ | grep -qi "<html"
          curl -fsS -H "Authorization: Bearer k" localhost:8080/api/state | python3 -m json.tool | head -20
          docker logs gpupool-smoke
      - name: Smoke test (conversion toolchain is present and loads)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          img=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run --rm --entrypoint sh "$img" -c             '"$GPUPOOL_CONVERT_PYTHON" "$GPUPOOL_CONVERT_DIR/convert_hf_to_gguf.py" --print-supported-models 2>&1 | grep -E "LlamaForCausalLM|Qwen2ForCausalLM"'
          docker run --rm --entrypoint sh "$img" -c             '"$GPUPOOL_LLAMA_TOOLS_DIR/llama-quantize" --help 2>&1 | head -5; test -x "$GPUPOOL_LLAMA_TOOLS_DIR/llama-tokenize"; test -x "$GPUPOOL_LLAMA_TOOLS_DIR/llama-simple"'
          docker run --rm --entrypoint sh "$img" -c '"$GPUPOOL_LLAMA_TOOLS_DIR/llama-imatrix" --help >/dev/null'

  agent:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (CUDA devel image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gpupool-agent
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          # Untagged builds compile one CUDA arch to stay within CI time; releases build all.
          build-args: |
            CUDA_ARCHS=${{ startsWith(github.ref, 'refs/tags/v') && '61;70;75;80;86;89;90' || '75' }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - name: Smoke test (binaries load without a GPU)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          img=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          docker run --rm --entrypoint /opt/llama/llama-server "$img" --version
          docker run --rm --entrypoint /opt/llama/ggml-rpc-server "$img" --help | head -5
          docker run --rm --entrypoint gpupool "$img" --help

  # Real end-to-end run: coordinator + 3 agents (CPU only) from the images built above, a tiny
  # model split across the servers over llama.cpp RPC, then a Hugging Face model is converted to
  # GGUF inside the coordinator and served. See scripts/ci_e2e.py.
  # The images are not passed between jobs as artifacts (the agent image is ~1.7 GB compressed, so
  # upload + download would cost about what it saves). Instead this job rebuilds them with
  # cache-from: type=gha on the scopes the build jobs just wrote, which makes it a layer pull and
  # an export, not a CUDA compile. Same build-args as `agent`, or the cache would miss.
  # Tags publish images, so this job does not run for them.
  e2e:
    needs: [coordinator, agent]
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space (agent image + CUDA layers + coordinator toolchain)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/coordinator.Dockerfile
          # Same build-args as the `coordinator` job, or the cache would miss. The e2e conversion
          # stage needs the toolchain.
          build-args: |
            WITH_CONVERT=1
          load: true
          tags: gpupool-coordinator:ci
          cache-from: type=gha,scope=coordinator
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/agent.Dockerfile
          build-args: |
            CUDA_ARCHS=75
          load: true
          tags: gpupool-agent:ci
          cache-from: type=gha,scope=agent
      - name: Cache the test model
        uses: actions/cache@v4
        with:
          path: .cache/ci-models
          # Bump the key with the model in scripts/ci_e2e.py (the script verifies its SHA256 anyway).
          key: ci-model-smollm2-135m-instruct-q8_0-v1
      - name: End-to-end (3 agents, model split over RPC, HF -> GGUF conversion)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GPUPOOL_AGENT_IMAGE: gpupool-agent:ci
          GPUPOOL_COORDINATOR_IMAGE: gpupool-coordinator:ci
        run: python3 scripts/ci_e2e.py
