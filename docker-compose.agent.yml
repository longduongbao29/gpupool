# Agent (every GPU server). Needs the NVIDIA Container Toolkit. Set in .env:
#   GPUPOOL_JOIN   http://<coordinator>:8080#<cluster_token>  (printed in the coordinator log)
# Optional: GPUPOOL_NODE_ID (default: hostname), GPUPOOL_HOST (default: auto-detected IP).
# then:  docker compose -f docker-compose.agent.yml up -d --build
# The server appears in the UI by itself.
# Where GitHub is blocked, see vendor/README.md and the "Building without GitHub" part of
# docs/QUICKSTART.en.md (a tarball in vendor/ and the optional build args below).
services:
  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      args:
        CUDA_ARCHS: ${CUDA_ARCHS:-61;70;75;80;86;89;90}
        # GitHub-free builds. Defaults match the Dockerfile (an empty value would override a
        # default there, so every non-empty default is repeated here).
        LLAMA_CPP_REF: ${LLAMA_CPP_REF:-b11342}
        LLAMA_CPP_URL: ${LLAMA_CPP_URL:-https://github.com/ggml-org/llama.cpp/archive/refs/tags/${LLAMA_CPP_REF:-b11342}.tar.gz}
        LLAMA_USE_PREBUILT_UI: ${LLAMA_USE_PREBUILT_UI:-ON}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.10}
        UV_PYTHON_INSTALL_MIRROR: ${UV_PYTHON_INSTALL_MIRROR:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: gpupool-agent:latest
    restart: unless-stopped
    network_mode: host   # engines listen on ports the coordinator picks, on this server's IP
    pid: host            # NVML reports host PIDs; needed for correct GPU process names
    cap_add: [NET_ADMIN] # only used with GPUPOOL_RPC_FIREWALL=1 (iptables rules for RPC ports)
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      GPUPOOL_JOIN: ${GPUPOOL_JOIN:?set GPUPOOL_JOIN in .env (see the coordinator log)}
      GPUPOOL_NODE_ID: ${GPUPOOL_NODE_ID:-}
      GPUPOOL_HOST: ${GPUPOOL_HOST:-}
      GPUPOOL_MARGIN_PCT: ${GPUPOOL_MARGIN_PCT:-0.10}
      # ggml-rpc-server has no authentication: 1 = each RPC port accepts only its head node
      GPUPOOL_RPC_FIREWALL: ${GPUPOOL_RPC_FIREWALL:-0}
    volumes:
      - gpupool-agent:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]

volumes:
  gpupool-agent:
