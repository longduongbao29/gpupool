# Coordinator (one machine):
#   docker compose -f docker-compose.coordinator.yml up -d --build
#   docker compose -f docker-compose.coordinator.yml logs   # UI URL, admin key, join command
# GPUPOOL_ADMIN_KEY / GPUPOOL_CLUSTER_TOKEN are optional: generated and stored in the data volume.
# Existing model files: set GPUPOOL_HOST_MODELS_DIR in .env to an ABSOLUTE folder (see .env.example).
services:
  coordinator:
    build:
      context: .
      dockerfile: docker/coordinator.Dockerfile
      args:
        # Where ghcr.io is blocked: a registry mirror, or UV_FROM_PYPI=1 to pip install uv.
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.10}
        UV_FROM_PYPI: ${UV_FROM_PYPI:-}
        # 1 = ship the HF -> GGUF conversion toolchain (adds ~2 GB), 0 = lean image.
        WITH_CONVERT: ${WITH_CONVERT:-1}
        # PyTorch CPU wheel index; set a mirror where download.pytorch.org is blocked.
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: gpupool-coordinator:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      GPUPOOL_ADMIN_KEY: ${GPUPOOL_ADMIN_KEY:-}
      GPUPOOL_CLUSTER_TOKEN: ${GPUPOOL_CLUSTER_TOKEN:-}
      GPUPOOL_API_KEYS: ${GPUPOOL_API_KEYS:-}
      GPUPOOL_PUBLIC_URL: ${GPUPOOL_PUBLIC_URL:-}
      GPUPOOL_WEBHOOK_URL: ${GPUPOOL_WEBHOOK_URL:-}
      HF_TOKEN: ${HF_TOKEN:-}
      # A path typed in the UI is a path on the HOST; inside the container the folder is /models.
      # The coordinator rewrites the host prefix to /models when the typed path does not exist.
      # Keep the host folder in forward slashes (JSON): /srv/gguf, C:/models.
      GPUPOOL_PATH_MAP: '{"${GPUPOOL_HOST_MODELS_DIR:-./models}": "/models"}'
    volumes:
      - gpupool-data:/data
      # Existing GGUF files on this machine, browsable in the UI under /models
      # (the image sets GPUPOOL_MODEL_ROOTS=/models). Use an absolute path in .env.
      - ${GPUPOOL_HOST_MODELS_DIR:-./models}:/models:ro

volumes:
  gpupool-data:
