# Coordinator (one machine):
#   docker compose -f docker-compose.coordinator.yml up -d --build
#   docker compose -f docker-compose.coordinator.yml logs   # UI URL, admin key, join command
# GPUPOOL_ADMIN_KEY / GPUPOOL_CLUSTER_TOKEN are optional: generated and stored in the data volume.
services:
  coordinator:
    build:
      context: .
      dockerfile: docker/coordinator.Dockerfile
    image: gpupool-coordinator:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GPUPOOL_ADMIN_KEY: ${GPUPOOL_ADMIN_KEY:-}
      GPUPOOL_CLUSTER_TOKEN: ${GPUPOOL_CLUSTER_TOKEN:-}
      GPUPOOL_API_KEYS: ${GPUPOOL_API_KEYS:-}
      GPUPOOL_PUBLIC_URL: ${GPUPOOL_PUBLIC_URL:-}
      GPUPOOL_WEBHOOK_URL: ${GPUPOOL_WEBHOOK_URL:-}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - gpupool-data:/data
      # Existing GGUF files on this machine, registered in the UI as /models/<file>.gguf
      - ${GPUPOOL_HOST_MODELS_DIR:-./models}:/models:ro

volumes:
  gpupool-data:
