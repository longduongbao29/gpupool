[project]
name = "gpupool"
version = "0.7.1"
description = "Pool scattered GPU memory across servers to serve LLMs via llama.cpp"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
keywords = ["llm", "llama.cpp", "gpu", "inference", "distributed", "openai-compatible", "gguf", "vram"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
authors = [
    { name = "Long Duong", email = "longduongbao29@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "gguf>=0.19.0",
    "httpx>=0.28.1",
    "nvidia-ml-py>=13.615.71",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/longduongbao29/gpupool"
Repository = "https://github.com/longduongbao29/gpupool"
Issues = "https://github.com/longduongbao29/gpupool/issues"
Changelog = "https://github.com/longduongbao29/gpupool/blob/master/CHANGELOG.md"

[project.scripts]
gpupool = "gpupool.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real: needs llama.cpp binaries, a GGUF file and a GPU (run with -m real)"]
addopts = "-m 'not real'"
